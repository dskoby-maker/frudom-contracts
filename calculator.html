<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Калькулятор тендеров ФД</title><style>body{font:15px system-ui,Arial;background:#f4f6f4;color:#1c2220;margin:0}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:27px}section{background:white;border-radius:16px;padding:20px;margin:16px 0}input{font:inherit}input[type=number]{width:110px;padding:8px;border:1px solid #ddd;border-radius:8px}input[type=range]{width:100%;accent-color:#6a2c4e}button{background:#6a2c4e;color:white;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}table{border-collapse:collapse;width:100%;min-width:850px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:right}th:first-child,td:first-child{text-align:left}.scroll{overflow:auto}.good{color:#247344}.bad{color:#ad3030}.muted{color:#66716b}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stats>div{background:#f4f6f4;padding:14px;border-radius:12px}strong{display:block;font-size:22px}.hint{background:#fff4dd;padding:12px;border-radius:10px}a{color:#6a2c4e}</style></head><body><main><a href="https://frudom.ru/contracts">← Контракты ФД</a><h1>Калькулятор тендеров</h1><section><p>Загрузите подготовленный JSON-файл закупки. Данные сохраняются в этом браузере. Исходные документы на сервер не отправляются.</p><input id="upload" type="file" accept=".json,application/json"><p id="status" class="muted"></p><select id="saved" style="padding:10px;max-width:100%"></select> <button id="remove">Удалить выбранный</button></section><div id="view"></div></main><script>
(function(){'use strict';const KEY='fdc-tenders-v1';let db={},current='',cut=10;const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2,minimumFractionDigits:2}),money=n=>fmt(n)+' ₽',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{db=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function validate(d){if(!d||d.schema!=='frudom-contract-v1'||!Array.isArray(d.items)||!d.items.length||!d.number)throw Error('Неверный формат: нужен frudom-contract-v1');if(d.items.length>500)throw Error('Слишком много позиций');d.items.forEach(x=>{if(typeof x.name!=='string'||!Number.isFinite(x.quantity)||x.quantity<=0||!Number.isFinite(x.unit_price)||x.unit_price<0)throw Error('Некорректная позиция');if(x.purchase_price!==null&&x.purchase_price!==undefined&&(!Number.isFinite(x.purchase_price)||x.purchase_price<0))throw Error('Некорректная закупочная цена')})}function menu(){let keys=Object.keys(db);$('saved').innerHTML=keys.map(k=>'<option value="'+esc(k)+'" '+(k===current?'selected':'')+'>'+esc(k+' — '+(db[k].title||''))+'</option>').join('');if(!db[current])current=keys[0]||'';$('saved').value=current;render()}function render(){const d=db[current];if(!d){$('view').innerHTML='<section>Загрузите JSON-файл закупки, чтобы увидеть калькулятор.</section>';return}let sum=d.items.reduce((a,x)=>a+x.quantity*x.unit_price,0),declared=Number(d.nmck),sales=declared*(1-cut/100),known=d.items.filter(x=>x.purchase_price!==null&&x.purchase_price!==undefined),cost=known.reduce((a,x)=>a+x.quantity*x.purchase_price,0),tax=(Number(d.tax_percent)||8)/100,log=Number(d.logistics)||0,full=known.length===d.items.length,partial=known.reduce((a,x)=>a+x.quantity*(x.unit_price*(1-cut/100)*(1-tax)-x.purchase_price),0);$('view').innerHTML='<section><h2>'+esc(d.title||d.number)+'</h2><p class="muted">№ '+esc(d.number)+' · Заказчик: '+esc(d.customer||'не указан')+'</p><p class="muted">НМЦК '+money(declared)+' · Сумма позиций '+money(sum)+'</p>'+(Math.abs(sum-declared)>.05?'<p class="hint">Внимание: сумма строк отличается от НМЦК на '+money(declared-sum)+'. Проверьте документы и округление.</p>':'')+'<label>Снижение: <strong id="pct">'+cut+'%</strong></label><input id="cut" type="range" min="0" max="40" step="1" value="'+cut+'"><div class="stats"><div>Контракт после снижения<strong>'+money(sales)+'</strong></div><div>АУСН '+fmt(tax*100)+'%<strong>'+money(sales*tax)+'</strong></div><div>После налога<strong>'+money(sales*(1-tax))+'</strong></div><div>Закупка известных позиций<strong>'+money(cost)+'</strong></div></div></section><section><h2>Позиции ('+d.items.length+')</h2><div class="scroll"><table><thead><tr><th>Товар</th><th>Кол-во</th><th>НМЦК/ед.</th><th>После снижения</th><th>После налога</th><th>Закупка/ед.</th><th>Остаток по строке</th></tr></thead><tbody>'+d.items.map((x,i)=>{let price=x.unit_price*(1-cut/100),net=price*(1-tax),has=x.purchase_price!==null&&x.purchase_price!==undefined,p=has?x.purchase_price:null,profit=has?x.quantity*(net-p):null;return '<tr><td>'+esc(x.name)+(x.note?'<small class="muted"> · '+esc(x.note)+'</small>':'')+'</td><td>'+fmt(x.quantity)+' '+esc(x.unit||'')+'</td><td>'+money(x.unit_price)+'</td><td>'+money(price)+'</td><td class="good">'+money(net)+'</td><td><input data-i="'+i+'" type="number" min="0" step=".01" value="'+(has?p:'')+'" placeholder="Неизвестно"></td><td class="'+(profit===null?'muted':profit<0?'bad':'good')+'">'+(profit===null?'—':money(profit))+'</td></tr>'}).join('')+'</tbody></table></div></section><section><h2>Прибыль</h2><label>Логистика, ₽ <input id="log" type="number" min="0" step="1000" value="'+log+'"></label><p>Заполнено закупочных цен: '+known.length+' из '+d.items.length+'</p>'+(full?'<strong class="'+(sales*(1-tax)-cost-log<0?'bad':'good')+'">'+money(sales*(1-tax)-cost-log)+'</strong><p class="muted">После налога, закупки и логистики. Без дополнительных затрат и потерь.</p>':'<p class="hint">Полная прибыль неизвестна. Остаток по заполненным позициям после относящегося к ним налога: '+money(partial)+'. Не хватает '+(d.items.length-known.length)+' закупочных цен.</p>')+'<button id="export">Скачать JSON с моими ценами</button></section>';$('cut').oninput=e=>{cut=Number(e.target.value);render()};document.querySelectorAll('[data-i]').forEach(el=>el.onchange=e=>{let v=e.target.value.trim();d.items[Number(e.target.dataset.i)].purchase_price=v===''?null:Number(v);save();render()});$('log').onchange=e=>{d.logistics=Math.max(0,Number(e.target.value)||0);save();render()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='contract-'+d.number+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}$('upload').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('Файл слишком большой');let d=JSON.parse(await f.text());validate(d);db[d.number]=d;current=d.number;cut=10;save();$('status').textContent='Закупка импортирована';menu()}catch(err){$('status').textContent='Ошибка: '+err.message}e.target.value=''};$('saved').onchange=e=>{current=e.target.value;cut=10;render()};$('remove').onclick=()=>{if(!current||!confirm('Удалить закупку '+current+' из этого браузера?'))return;delete db[current];save();current='';menu()};menu()})();
</script></body></html>
